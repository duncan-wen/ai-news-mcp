[project]
name = "ai-news-mcp"
version = "0.1.0"
description = "MCP server that collects AI news from many Sources into a local store for Claude to query."
authors = [
    { name = "Duncan WEN", email = "lumpa7223@gmail.com" }
]
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["mcp", "model-context-protocol", "claude", "ai-news", "rss"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content :: News/Diary",
]
dependencies = [
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "platformdirs>=4.14.5",
    "trafilatura>=2.3.1",
]

[project.urls]
Homepage = "https://github.com/duncan-wen/ai-news-mcp"
Repository = "https://github.com/duncan-wen/ai-news-mcp"
Issues = "https://github.com/duncan-wen/ai-news-mcp/issues"

[project.scripts]
ai-news-mcp = "ai_news_mcp:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anyio>=4.16.0",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# ADR 0002: the server never calls an LLM.
"anthropic".msg = "The server never calls an LLM (docs/adr/0002-no-llm-in-the-server.md)."
"openai".msg = "The server never calls an LLM (docs/adr/0002-no-llm-in-the-server.md)."
"google.genai".msg = "The server never calls an LLM (docs/adr/0002-no-llm-in-the-server.md)."
"google.generativeai".msg = "The server never calls an LLM (docs/adr/0002-no-llm-in-the-server.md)."
"mistralai".msg = "The server never calls an LLM (docs/adr/0002-no-llm-in-the-server.md)."
"cohere".msg = "The server never calls an LLM (docs/adr/0002-no-llm-in-the-server.md)."
"litellm".msg = "The server never calls an LLM (docs/adr/0002-no-llm-in-the-server.md)."

[tool.pyright]
include = ["src", "tests", "scripts"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
# A concurrency test whose held Fetcher is never released fails here instead of hanging CI.
timeout = 10
# Lists any test over half a second: the suite runs in ~4 s, and a slow test usually means
# a production delay (real time the Clock does not control) leaked into the tests.
addopts = "--durations=5 --durations-min=0.5"
# scripts/check sets PYTHONWARNDEFAULTENCODING=1, so an open/read_text/write_text without
# encoding= warns; this project's modules fail on it (trafilatura has one at import).
filterwarnings = ["error::EncodingWarning:(ai_news_mcp|tests)"]

name: publish

# Pushing a tag such as v0.1.0 publishes that version to PyPI through Trusted Publishing
# (PyPI trusts this workflow in the `pypi` environment, so no token is stored), then lists
# server.json on the MCP Registry through GitHub OIDC.
#
# A pull request that changes this file runs the build and the artifact round trip without
# publishing, so an upgrade of the artifact actions is tested before a release needs it.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/publish.yml"]

jobs:
  check:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/check.yml

  build:
    needs: check
    # Runs when check passed, or was skipped on a pull request.
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Check the tag names the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "${GITHUB_REF_NAME#v}" = "$(uv version --short)"
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # The pull-request half of the artifact round trip: publish does the same download on a tag.
  download:
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Check the sdist and wheel arrived
        run: ls dist/*.tar.gz dist/*.whl

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ai-news-mcp
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  registry:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.8
    steps:
      - uses: actions/checkout@v7
      - name: Install mcp-publisher (checksum verified)
        run: |
          base="https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION"
          curl -fsSLO "$base/mcp-publisher_linux_amd64.tar.gz"
          curl -fsSLO "$base/registry_${MCP_PUBLISHER_VERSION#v}_checksums.txt"
          sha256sum --check --ignore-missing "registry_${MCP_PUBLISHER_VERSION#v}_checksums.txt"
          tar xzf mcp-publisher_linux_amd64.tar.gz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      # The registry checks ownership by reading the package's PyPI page, which can lag
      # the upload by a few minutes.
      - name: Publish server.json
        run: |
          for attempt in 1 2 3 4 5; do
            ./mcp-publisher publish && exit 0
            echo "Attempt $attempt failed; retrying in 60 s."
            sleep 60
          done
          exit 1
